%YAML 1.2
---
$id: http://devicetree.org/schemas/reset/lantiq,grx500-rcu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Lantiq GRX500 reset and system configuration unit

maintainers:
  - OpenWrt Development List <openwrt-devel@lists.openwrt.org>

description: |
  Reset IDs 0 through 31 select bits in the request register at offset 0x10;
  IDs 32 through 63 select bits in the request register at offset 0x48.
  The region also contains peripheral endian and PHY configuration registers.

properties:
  compatible:
    items:
      - const: lantiq,grx500-rcu
      - const: syscon
  reg:
    maxItems: 1
  native-endian: true
  '#reset-cells':
    const: 1

required:
  - compatible
  - reg
  - native-endian
  - '#reset-cells'

additionalProperties: false
